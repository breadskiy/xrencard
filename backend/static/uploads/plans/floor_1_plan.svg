<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background & Grid -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Walls -->
  <rect x="50" y="50" width="700" height="500" rx="16" fill="#ffffff" stroke="#334155" stroke-width="6"/>

  <!-- Zone: Reception -->
  <rect x="80" y="200" width="180" height="200" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="170" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Ресепшн</text>

  <!-- Zone: Central Atrium -->
  <circle cx="350" cy="300" r="80" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="350" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Центральный атриум</text>

  <!-- Zone: Cafe & Lounge -->
  <rect x="260" y="80" width="180" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Кофейня &amp; Лаунж</text>

  <!-- Zone: Elevators -->
  <rect x="260" y="400" width="180" height="120" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="350" y="465" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">Лифтовой холл</text>

  <!-- Zone: Congress Hall -->
  <rect x="470" y="120" width="250" height="360" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <text x="595" y="305" font-family="sans-serif" font-size="16" font-weight="bold" fill="#be123c" text-anchor="middle">Конгресс-холл «Премьер»</text>

  <!-- Corridors / Pathways -->
  <line x1="170" y1="300" x2="270" y2="300" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,6"/>
  <line x1="350" y1="200" x2="350" y2="220" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,6"/>
  <line x1="350" y1="380" x2="350" y2="400" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,6"/>
  <line x1="430" y1="300" x2="470" y2="300" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,6"/>
</svg>